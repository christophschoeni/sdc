[project]
name = "sdc"
version = "0.1.0"
description = "SCHOENI DIGITAL CLI: doctor, new, check"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4.23",
    "rich>=15.0.0",
    "questionary>=2.1.1",
]

[project.scripts]
sdc = "sdc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdc"]

[dependency-groups]
dev = ["pytest>=8"]
